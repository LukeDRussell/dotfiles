- name: Install packages
  community.general.homebrew:
    name: "{{ common_packaged_apps + brew_apps }}"
    state: present

- name: Upgrade packages
  community.general.homebrew:
    upgrade_all: true

- name: Install casks
  community.general.homebrew_cask:
    name: "{{ brew_casks }}"
    state: present

- name: Upgrade casks
  community.general.homebrew_cask:
    upgrade_all: true

- name: Turn off MacOS defaults (booleans)
  community.general.osx_defaults:
    key: "{{ item }}"
    type: bool
    value: false
  loop:
    - ApplePressAndHoldEnabled
    - NSAutomaticDashSubstitutionEnabled
    - NSAutomaticCapitalizationEnabled
    - NSAutomaticQuoteSubstitutionEnabled
    - NSAutomaticSpellingCorrectionEnabled
    - QuitMenuItem

- name: Use Homebrew bash as the login shell
  vars:
    brew_bash: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}/bin/bash"
  block:
    - name: Allow Homebrew bash in /etc/shells
      become: true
      ansible.builtin.lineinfile:
        path: /etc/shells
        line: "{{ brew_bash }}"

    - name: Set Homebrew bash as the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: "{{ brew_bash }}"
