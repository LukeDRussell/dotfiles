# Dotfiles themselves are managed by chezmoi (see home/); this just runs it.
- name: Point chezmoi at this repo
  ansible.builtin.command:
    cmd: "chezmoi init --source {{ playbook_dir }}"
  changed_when: false

- name: Apply dotfiles with chezmoi
  ansible.builtin.command:
    cmd: chezmoi apply --verbose --force
  register: chezmoi_apply
  changed_when: chezmoi_apply.stdout | length > 0

# TODO: Make this idempotent and return accurate changed value
- name: Install fisher
  ansible.builtin.shell:
    cmd: curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish | source && fisher install jorgebucaran/fisher
  args:
    executable: /usr/bin/fish

- name: Install fish plugins
  ansible.builtin.shell:
    cmd: "fisher install  {{ item }}"
  args:
    executable: /usr/bin/fish
  loop:
    - nickeb96/puffer-fish
    - IlanCosman/tide@v6

- name: Change default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/fish
