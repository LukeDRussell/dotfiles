# Dotfiles themselves are managed by chezmoi (see home/); this just runs it.
- name: Point chezmoi at this repo
  ansible.builtin.command:
    cmd: "chezmoi init --source {{ playbook_dir }}"
  changed_when: false

- name: Apply dotfiles with chezmoi
  ansible.builtin.command:
    cmd: chezmoi apply --verbose --force
  register: chezmoi_apply
  changed_when: chezmoi_apply.stdout | length > 0

- name: Download fisher
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish
    dest: /tmp/fisher.fish
    mode: "0644"

- name: Install fisher
  ansible.builtin.shell:
    cmd: source /tmp/fisher.fish && fisher install jorgebucaran/fisher
    creates: ~/.config/fish/functions/fisher.fish
  args:
    executable: /usr/bin/fish

- name: List fish plugins
  ansible.builtin.command:
    cmd: fish -c "fisher list"
  register: fisher_list
  changed_when: false

- name: Install fish plugins
  ansible.builtin.command:
    cmd: fish -c "fisher install {{ item }}"
  loop:
    - nickeb96/puffer-fish
  when: (item | lower) not in (fisher_list.stdout | lower)
  changed_when: true

- name: Change default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/fish
