- name: Install common packages
  become: true
  ansible.builtin.dnf:
    name: "{{ common_packaged_apps }}"
    state: present

- name: Install Fedora packages
  become: true
  ansible.builtin.dnf:
    name: "{{ fedora_apps }}"
    state: present

- name: Update packages
  become: true
  ansible.builtin.package:
    name: "*"
    state: latest
    update_only: true
    update_cache: true
