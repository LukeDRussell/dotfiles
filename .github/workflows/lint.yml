# Runs on every push: the repo has no tests, so this is the safety net.
name: Lint

on:
  push:
  pull_request:

jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # "ansible" (not just ansible-core) brings community.general, which the
      # macOS tasks use
      - run: pip install ansible ansible-lint
      - run: ansible-lint

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck --shell=bash bootstrap.sh home/dot_bashrc home/dot_bash_profile
